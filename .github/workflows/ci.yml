name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowcraft
          POSTGRES_PASSWORD: flowcraft
          POSTGRES_DB: flowcraft_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://flowcraft:flowcraft@localhost:5433/flowcraft_test?schema=public
      DIRECT_URL: postgresql://flowcraft:flowcraft@localhost:5433/flowcraft_test?schema=public
      AUTH_SECRET: ci-secret-key-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
